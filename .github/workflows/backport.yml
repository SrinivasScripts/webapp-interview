name: Backport Workflows
on:
  pull_request:
    branches: [test-main, test-stable]
    types: [closed]
  pull_request_review:
    types: [submitted]

env:
  AWS_REGION: eu-west-1
  AWS_ROLE: arn:aws:iam::998607346652:role/github_openid
  UV_VERSION: "0.6.10"
  PYTHON_VERSION: "3.11.11"
  AWS_CODEARTIFACT_ACCOUNT: "998607346652"
  DOMAIN: "okra"
  REPOSITORY_NAME: "pypi-all"

jobs:
  backport-stable-pr:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'test-main'
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
      new-version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: test-main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Prepare stable branch
        run: |
          git fetch origin
          git checkout -b test-stable origin/test-stable
          git merge origin/test-main --no-edit

      - name: Update version
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          NEW_VERSION="${VERSION%.*}.$(date +'%Y%m%d')"
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Updated version: $VERSION → $NEW_VERSION"

      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          commit-message: "chore: update version for stable release"
          branch: "backport-stable-${{ steps.version.outputs.new_version }}"
          title: "[AUTO] Backport main → stable v${{ steps.version.outputs.new_version }}"
          base: test-stable
          labels: |
            auto-backport
            stable-release
            needs-2-approvals
          body: |
            ## 🤖 Automated Backport
            
            **Version:** `${{ steps.version.outputs.new_version }}`
            **Source:** `test-main` → `test-stable`
            
            ### ⚠️ Review Required
            This PR requires **2 approvals** before auto-merge.
            
            ### 📋 Changes
            - Updated version in pyproject.toml
            - Backported latest changes from main branch
            
            *Will auto-merge once 2 approvals are received.*

      - name: Notify reviewers
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.BOT_ACCESS_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-pr.outputs.pull-request-number }},
              body: '📋 **Status:** Awaiting 2 approvals for auto-merge\n🔄 **Next:** Will merge automatically once approved'
            });

  auto-merge-stable:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'test-stable' &&
      startsWith(github.event.pull_request.title, '[AUTO] Backport main → stable')
    runs-on: ubuntu-latest
    steps:
      - name: Process approval and merge
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.BOT_ACCESS_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            
            // Get unique approvals
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const approvers = [...new Set(
              reviews
                .filter(r => r.state === 'APPROVED' && r.user.type !== 'Bot')
                .map(r => r.user.login)
            )];
            
            const approvalCount = approvers.length;
            console.log(`Approvals: ${approvalCount}/2 from [${approvers.join(', ')}]`);
            
            const statusComment = approvalCount >= 2 
              ? `🎉 **Auto-merging!** Received ${approvalCount} approvals from: ${approvers.join(', ')}`
              : `⏳ **Status:** ${approvalCount}/2 approvals received${approvers.length ? ` from: ${approvers.join(', ')}` : ''}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: statusComment
            });
            
            if (approvalCount >= 2) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              if (pr.state === 'open' && pr.mergeable) {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'merge',
                  commit_title: `${pr.title.replace('[AUTO] ', '')}`,
                  commit_message: `Auto-merged after ${approvalCount} approvals: ${approvers.join(', ')}`
                });
                console.log('✅ Auto-merged successfully');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `❌ **Cannot merge:** PR state: ${pr.state}, mergeable: ${pr.mergeable}`
                });
              }
            }

  backport-dev-pr:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'test-stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: test-stable
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Prepare develop branch
        run: |
          git fetch origin
          git checkout -b test-develop origin/test-develop
          git merge origin/test-stable --no-edit

      - name: Update version for develop
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          NEW_VERSION="${VERSION%.*}.$(date +'%Y%m%d')-dev"
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and merge develop PR
        uses: peter-evans/create-pull-request@v3
        id: dev-pr
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          commit-message: "chore: update version for develop"
          branch: "backport-dev-${{ steps.version.outputs.new_version }}"
          title: "[AUTO] Backport stable → develop v${{ steps.version.outputs.new_version }}"
          base: test-develop
          body: |
            ## 🤖 Automated Backport
            **Version:** `${{ steps.version.outputs.new_version }}`
            **Source:** `test-stable` → `test-develop`
            
            Auto-merging develop backport.

      - name: Auto-approve and merge
        if: steps.dev-pr.outputs.pull-request-number
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.BOT_ACCESS_TOKEN }}
          script: |
            const prNumber = ${{ steps.dev-pr.outputs.pull-request-number }};
            
            // Approve PR
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'Auto-approved develop backport'
            });
            
            // Wait briefly for approval to register
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Merge PR
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge',
              commit_title: 'chore: backport stable → develop',
              commit_message: 'Automated backport from stable to develop branch'
            });
            
            console.log('✅ Develop PR auto-merged');
