name: Backport Workflows

on:
  pull_request:
    branches: [test-main, test-stable]
    types: [closed]

jobs:
  backport-stable-pr:
    if: ${{ github.event.pull_request.merged && github.event.pull_request.base.ref == 'test-main' }}
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pull-request-number }}
    steps:
      - name: Checkout test-main
        uses: actions/checkout@v4
        with:
          ref: test-main
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create test-stable from test-main
        run: |
          git fetch origin
          git checkout -b test-stable origin/test-stable
          git merge origin/test-main --no-edit

      - name: Update version
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          NEW_VERSION="${VERSION%.*}.$(date +'%Y%m%d')"
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create PR test-main → test-stable
        id: create-pr
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          commit-message: "chore: backport to stable"
          branch: "backport-stable-${{ steps.version.outputs.new_version }}"
          title: "[AUTO] Backport main → stable v${{ steps.version.outputs.new_version }}"
          base: test-stable
          body: |
            🤖 Automated backport from `test-main` to `test-stable`.

            Version bumped to `${{ steps.version.outputs.new_version }}`.
          labels: |
            auto-backport
            stable

      - name: Approve PR using second bot
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v6
        with:
          github-token:  ${{ secrets.APPROVER_BOT_TOKEN}}
          script: |
            const prNumber = parseInt('${{ steps.create-pr.outputs.pull-request-number }}');
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: '✅ Auto-approved by secondary bot'
            });

      - name: Merge PR if approved
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.BOT_ACCESS_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.create-pr.outputs.pull-request-number }}');
            let approvals = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const approved = approvals.data.filter(r => r.state === 'APPROVED');
            if (approved.length < 2) {
              core.setFailed(`❌ Only ${approved.length} approvals - cannot auto-merge`);
            } else {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge',
                commit_title: 'chore: auto-merge stable backport'
              });
              console.log('✅ PR auto-merged');
            }

  backport-dev-pr:
    needs: backport-stable-pr
    if: ${{ needs.backport-stable-pr.outputs.pr-number != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test-stable
        uses: actions/checkout@v4
        with:
          ref: test-stable
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Merge test-stable → test-develop
        run: |
          git fetch origin
          git checkout -b test-develop origin/test-develop
          git merge origin/test-stable --no-edit

      - name: Update develop version
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
          NEW_VERSION="${VERSION%.*}.$(date +'%Y%m%d')-dev"
          sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create PR test-stable → test-develop
        id: create-pr
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN }}
          commit-message: "chore: backport to develop"
          branch: "backport-develop-${{ steps.version.outputs.new_version }}"
          title: "[AUTO] Backport stable → develop v${{ steps.version.outputs.new_version }}"
          base: test-develop
          body: |
            🤖 Automated backport from `test-stable` to `test-develop`.

            Version bumped to `${{ steps.version.outputs.new_version }}`.

      - name: Auto-approve and merge develop PR
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.APPROVER_BOT_TOKEN  }}
          script: |
            const prNumber = parseInt('${{ steps.create-pr.outputs.pull-request-number }}');
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: '✅ Auto-approved backport to develop'
            });

            await new Promise(resolve => setTimeout(resolve, 3000)); // wait for approval to register

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'merge',
              commit_title: 'chore: auto-merge develop backport'
            });
